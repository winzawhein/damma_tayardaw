<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ဘုရားကျောင်းဆောင်</title>
<link rel="icon" href="data:,">
<style>
  @font-face {
    font-family: MyanUni;
    /* fonts/ on the app's loopback server; ../fonts/ in the Flutter web build. */
    src: url(fonts/pds_regular.ttf) format('truetype'), url(../fonts/pds_regular.ttf) format('truetype');
    font-weight: 400;
    font-display: swap;
  }
  /* Pyidaungsu Bold (shrine3d/fonts): true bold lettering. Without it the
     browser thickens the regular face, which smudges small Myanmar type. */
  @font-face {
    font-family: MyanUni;
    src: url(fonts/pds_bold.ttf) format('truetype');
    font-weight: 700;
    font-display: swap;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #15120c;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; opacity: 0; transition: opacity 0.9s ease; }
  body.ready #stage { opacity: 1; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Without post-processing (?q=low) a soft CSS vignette stands in for the shader one. */
  body.no-post #stage::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 85% 70% at 50% 48%, rgba(10, 5, 2, 0) 55%, rgba(10, 5, 2, 0.42) 100%);
  }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  /* Labels: a lacquer-and-gold tag, its painted object in a small medallion,
     tied to the thing itself by a fine thread of gold that ends in a spark. */
  .lbl {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 2px 11px 3px 3px;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(80, 43, 23, 0.8), rgba(40, 21, 11, 0.86));
    border: 1px solid rgba(232, 193, 90, 0.62);
    color: #fbf0d6;
    font: 700 13px/1.5 MyanUni, 'Noto Sans Myanmar', 'Myanmar Sangam MN', Padauk, sans-serif;
    letter-spacing: 0.01em;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(20, 8, 2, 0.6);
    box-shadow: 0 4px 14px rgba(12, 6, 2, 0.35), inset 0 1px 0 rgba(255, 230, 170, 0.24);
    -webkit-backdrop-filter: blur(6px) saturate(1.25);
    backdrop-filter: blur(6px) saturate(1.25);
    transition: opacity 0.45s ease, filter 0.2s ease;
    will-change: transform, opacity;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .lbl { background: linear-gradient(180deg, rgba(70, 38, 20, 0.9), rgba(36, 19, 10, 0.92)); }
  }
  /* Lower quality rungs (body.lite): a blur behind every tag re-reads the
     moving canvas each frame, so the tags turn solid lacquer instead. */
  body.lite .lbl {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background: linear-gradient(180deg, rgba(70, 38, 20, 0.9), rgba(36, 19, 10, 0.92));
  }
  .lbl.plain { padding-left: 10px; }
  .lbl .ico {
    flex: none;
    width: 23px;
    height: 23px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 35% 30%, #6e3420, #26120a 75%);
    box-shadow: inset 0 0 0 1px rgba(232, 193, 90, 0.75), 0 1px 3px rgba(0, 0, 0, 0.45);
  }
  .lbl .ico img { width: 19px; height: 19px; object-fit: contain; }
  .lbl .gem {
    flex: none;
    width: 6px;
    height: 6px;
    margin: 0 1px 0 3px;
    border-radius: 1px;
    transform: rotate(45deg);
    background: linear-gradient(135deg, #ffe7a6, #c9932e);
    box-shadow: 0 0 6px rgba(255, 210, 120, 0.6);
  }
  .lbl .chk {
    display: none;
    width: 16px;
    height: 16px;
    margin-left: 1px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff0b8, #d9a23a);
    color: #4a2a0e;
    font: 700 11px/16px system-ui, sans-serif;
    text-align: center;
    text-shadow: none;
  }
  .lbl.done .chk { display: inline-block; }
  .lbl.done { border-color: rgba(255, 220, 140, 0.8); }
  /* the thread and its spark */
  .lbl::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 14px;
    margin-left: -0.5px;
    background: linear-gradient(rgba(232, 193, 90, 0.9), rgba(232, 193, 90, 0.15));
    pointer-events: none;
  }
  .lbl::before {
    content: '';
    position: absolute;
    left: 50%;
    top: calc(100% + 13px);
    width: 5px;
    height: 5px;
    margin-left: -2.5px;
    border-radius: 50%;
    background: #ffe2a0;
    box-shadow: 0 0 6px 2px rgba(255, 200, 110, 0.65);
    pointer-events: none;
  }
  .lbl.below::after { top: auto; bottom: 100%; background: linear-gradient(to top, rgba(232, 193, 90, 0.9), rgba(232, 193, 90, 0.15)); }
  .lbl.below::before { top: auto; bottom: calc(100% + 13px); }
  /* the offering the day asks for next: its tag breathes a soft light */
  .lbl.beckon { animation: beckon 2.6s ease-in-out infinite; }
  @keyframes beckon {
    0%, 100% { box-shadow: 0 4px 14px rgba(12, 6, 2, 0.35), inset 0 1px 0 rgba(255, 230, 170, 0.24), 0 0 0 0 rgba(255, 206, 120, 0); }
    50% { box-shadow: 0 4px 14px rgba(12, 6, 2, 0.35), inset 0 1px 0 rgba(255, 230, 170, 0.24), 0 0 0 4px rgba(255, 206, 120, 0.16), 0 0 18px rgba(255, 196, 100, 0.5); }
  }
  .lbl:active { filter: brightness(1.25); }
  /* The rite's words: small and calm, high in the view, clear of the gong. */
  #rite {
    position: fixed;
    left: 0;
    right: 0;
    top: 13%;
    display: grid;
    justify-items: center;
    pointer-events: none;
  }
  .rite-line {
    grid-area: 1 / 1;
    padding: 2px 16px 4px;
    border-radius: 999px;
    background: radial-gradient(closest-side, rgba(30, 14, 6, 0.32), rgba(30, 14, 6, 0));
    font: 27px/1.5 MyanUni, 'Noto Sans Myanmar', 'Myanmar Sangam MN', Padauk, serif;
    color: #fbe7bf;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 3px rgba(20, 8, 2, 0.75), 0 0 10px rgba(255, 196, 120, 0.25);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.22, 0.8, 0.3, 1);
  }
  .rite-line.on { opacity: 1; transform: translateY(0); }
  /* 3D spaces: their own HTML layer, and the warm veil that hides the change of place */
  #space-ui { position: fixed; inset: 0; pointer-events: none; }
  #space-ui > * { pointer-events: auto; }
  #veil {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse 90% 70% at 50% 45%, #3b2615 0%, #140c06 78%);
    transition: opacity 0.42s ease;
  }
  #veil.on { opacity: 1; }
  /* a space still compiling on a cold GPU: a slowly turning ring of gold */
  #veil::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 46%;
    width: 30px;
    height: 30px;
    margin: -15px 0 0 -15px;
    border-radius: 50%;
    border: 2px solid rgba(232, 193, 90, 0.16);
    border-top-color: rgba(232, 193, 90, 0.85);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #veil.wait::after { opacity: 1; animation: veil-turn 1s linear infinite; }
  @keyframes veil-turn { to { transform: rotate(360deg); } }
  /* ...and the beckoning tag breathes with its light alone (no repainted shadow) */
  body.lite .lbl.beckon { animation: beckon-lite 2.6s ease-in-out infinite; }
  @keyframes beckon-lite {
    0%, 100% { border-color: rgba(232, 193, 90, 0.62); }
    50% { border-color: rgba(255, 226, 160, 1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage, .lbl, .rite-line { transition: none; }
    .lbl.beckon, body.lite .lbl.beckon { animation: none; }
  }
  /* The stone theme (?theme=stone, body.stone): frosted pearl tags on a
     silver thread, moonlit words, a veil of white marble. */
  body.stone .lbl {
    background: linear-gradient(180deg, rgba(252, 253, 255, 0.8), rgba(230, 236, 244, 0.86));
    border-color: rgba(146, 166, 190, 0.6);
    color: #2a394b;
    text-shadow: none;
    box-shadow: 0 4px 14px rgba(26, 36, 52, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.75);
  }
  body.lite.stone .lbl { background: linear-gradient(180deg, rgba(250, 252, 255, 0.95), rgba(228, 235, 243, 0.96)); }
  body.stone .lbl .ico {
    background: radial-gradient(circle at 35% 30%, #ffffff, #d6e0ec 75%);
    box-shadow: inset 0 0 0 1px rgba(136, 158, 186, 0.75), 0 1px 3px rgba(26, 36, 52, 0.25);
  }
  body.stone .lbl .gem { background: linear-gradient(135deg, #ffffff, #9db2ca); box-shadow: 0 0 6px rgba(186, 208, 240, 0.75); }
  body.stone .lbl .chk { background: radial-gradient(circle at 35% 30%, #ffffff, #b6c7db); color: #2a394b; }
  body.stone .lbl.done { border-color: rgba(116, 144, 178, 0.85); }
  body.stone .lbl::after { background: linear-gradient(rgba(238, 244, 252, 0.95), rgba(238, 244, 252, 0.2)); }
  body.stone .lbl.below::after { background: linear-gradient(to top, rgba(238, 244, 252, 0.95), rgba(238, 244, 252, 0.2)); }
  body.stone .lbl::before { background: #f4f8ff; box-shadow: 0 0 6px 2px rgba(196, 218, 255, 0.75); }
  body.stone .lbl.beckon { animation-name: beckon-stone; }
  @keyframes beckon-stone {
    0%, 100% { box-shadow: 0 4px 14px rgba(26, 36, 52, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 0 0 0 rgba(186, 210, 245, 0); }
    50% { box-shadow: 0 4px 14px rgba(26, 36, 52, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 0 0 4px rgba(186, 210, 245, 0.24), 0 0 18px rgba(176, 204, 245, 0.6); }
  }
  body.lite.stone .lbl.beckon { animation-name: beckon-lite-stone; }
  @keyframes beckon-lite-stone {
    0%, 100% { border-color: rgba(146, 166, 190, 0.6); }
    50% { border-color: rgba(96, 128, 170, 1); }
  }
  body.stone .rite-line {
    color: #f4f8ff;
    background: radial-gradient(closest-side, rgba(18, 26, 38, 0.32), rgba(18, 26, 38, 0));
    text-shadow: 0 1px 3px rgba(8, 14, 24, 0.75), 0 0 10px rgba(176, 204, 245, 0.3);
  }
  body.stone #veil { background: radial-gradient(ellipse 90% 70% at 50% 45%, #fdfbf8 0%, #e6dfd5 78%); }
  body.stone #veil::after { border-color: rgba(168, 117, 18, 0.16); border-top-color: rgba(168, 117, 18, 0.8); }
  /* the white room's page is light from its first paint (html.stone is set from the URL below) */
  html.stone, html.stone body { background: #f1ece5; }
  @media (prefers-reduced-motion: reduce) {
    body.stone .lbl.beckon, body.lite.stone .lbl.beckon { animation: none; }
  }

/* Ivory sanctuary: jade tags, fine gold edges, and a quieter devotional frame. */
body.stone .lbl {background:linear-gradient(140deg,rgba(17,55,45,.94),rgba(8,31,27,.94));color:#fff0ca;border:1px solid #c9ab6a;text-shadow:0 1px 2px #0004;box-shadow:0 5px 18px #142d2926;}
body.stone .lbl .gem {background:linear-gradient(135deg,#fff0b9,#c79b47)}
body.stone .lbl.done .chk {background:#e9d29a;color:#193d32}
body.stone .rite-line {color:#f7e7bb;text-shadow:0 2px 8px #17342b}
#sanctuary-trim {position:fixed;inset:10px;pointer-events:none;border:1px solid #c5a46266;border-radius:24px;box-shadow:inset 0 0 40px #e3d4b312;}
#sanctuary-trim:before,#sanctuary-trim:after {content:'✧';position:absolute;left:50%;transform:translateX(-50%);color:#a3823c;font-size:23px;line-height:1;background:#f0e9d9b3;padding:0 14px;}
#sanctuary-trim:before{top:-10px}#sanctuary-trim:after{bottom:-10px}

/* Override the renderer's lite + stone selectors as well as normal quality. */
body.stone .lbl, body.lite.stone .lbl, body .lbl {
 background:#163d32 !important;color:#fff5d9 !important;border:1px solid #b59650 !important;
 font-size:14px !important;line-height:1.55 !important;text-shadow:none !important;
 backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
 box-shadow:0 2px 5px #0002 !important;animation:none !important;
}
.lbl span {color:inherit !important}
body.stone .lbl .chk {color:#163d32 !important;background:#f1d692 !important}
#sanctuary-trim {display:none}
</style>
<script>if (/[?&]theme=stone(&|$)/.test(location.search)) document.documentElement.classList.add('stone');</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="rite"></div>
<div id="space-ui"></div>
<div id="veil"></div><div id="sanctuary-trim" aria-hidden="true"></div>
<script id="shrine-bootstrap">
  // The renderer is created while shrine.js is evaluated, before the scene's
  // own error handler exists. Report boot failures so the host can offer Retry.
  (() => {
    let reported = false;
    function fail(message) {
      // core.js reports a phone that cannot run the room itself (window.__shrineFatal).
      if (reported || window.__shrineFatal || document.body.classList.contains('ready')) return;
      reported = true;
      const json = JSON.stringify({ type: 'error', fatal: true, message: String(message) });
      try {
        if (window.ShrineBridge && window.ShrineBridge.postMessage) window.ShrineBridge.postMessage(json);
        else if (window.parent !== window) window.parent.postMessage('shrine:' + json, location.origin);
        else console.error('[shrine boot]', message);
      } catch (_) { /* host gone */ }
    }
    window.addEventListener('error', (event) => {
      if (event.target && event.target.id === 'shrine-bundle') fail('scene_script_load_failed');
      else if (event.message) fail(event.message);
    }, true);
    window.addEventListener('unhandledrejection', (event) => {
      const reason = event.reason;
      fail(reason && reason.message ? reason.message : reason || 'scene_boot_failed');
    });
  })();
</script>
<script id="shrine-bundle" src="shrine.js"></script>
</body>
</html>
